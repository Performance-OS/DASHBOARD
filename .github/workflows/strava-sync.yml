name: Strava Sync

on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes - covers everyone connected in one run
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab too

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo (so strava-sync.js actually exists to run)
        uses: actions/checkout@v4
      - name: Sync every connected Strava account
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          SUPABASE_URL: 'https://mefuldlvyaorzulrnnyx.supabase.co'
          # Service role key, not anon key - this script has no live user session for anyone
          # it's syncing, so it needs the key that bypasses RLS entirely. Anon key alone can no
          # longer read/write user-scoped kv_store rows now that RLS is the only protection.
          # ADD THIS AS A NEW REPO SECRET before this workflow will work again:
          # Settings -> Secrets and variables -> Actions -> New repository secret
          # Name: SUPABASE_SERVICE_ROLE_KEY
          # Value: from your Supabase project -> Settings -> API -> "service_role" key (secret)
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node strava-sync.js
